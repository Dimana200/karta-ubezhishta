name: Update shelter data
on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Country codes separated by spaces (empty = all of Europe)"
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * 1"   # every Monday 03:17 UTC
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download from OpenStreetMap
        run: python3 scripts/build_data.py ${{ github.event.inputs.countries }}
      - name: Commit data
        run: |
          git config user.name "shelter-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update shelter data $(date -u +%F)"
          git push
