name: Diag overpass
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          UA="karta-ubezhishta/1.0 (https://github.com/Dimana200/karta-ubezhishta)"
          Q='[out:json][timeout:60];nwr["military"="bunker"](42.6,23.2,42.8,23.4);out center tags;'
          echo "== overpass-api.de small with UA"
          curl -4 -sS -m 90 -A "$UA" -o /tmp/o.json -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter || true; head -c 300 /tmp/o.json; echo
          Q2='[out:json][timeout:300];area["ISO3166-1"="BG"][admin_level=2]->.a;(nwr["military"="bunker"](area.a);nwr["railway"="station"]["station"="subway"](area.a););out center tags;'
          echo "== overpass-api.de AREA BG with UA"
          curl -4 -sS -m 400 -A "$UA" -o /tmp/o.json -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" --data-urlencode "data=$Q2" https://overpass-api.de/api/interpreter || true; head -c 200 /tmp/o.json; echo
          F='(military=bunker or building=bunker or bunker_type in (bomb_shelter,personnel_shelter) or (amenity=shelter and shelter_type=bomb_shelter) or (railway=station and station=subway))'
          echo "== ohsome BG bbox"
          curl -4 -sS -m 400 -A "$UA" -o /tmp/h.json -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" --data-urlencode "bboxes=22.3,41.2,28.7,44.3" --data-urlencode "filter=$F" --data-urlencode "properties=tags,metadata" https://api.ohsome.org/v1/elements/centroid || true
          head -c 600 /tmp/h.json; echo; python3 -c "import json;d=json.load(open('/tmp/h.json'));print('features',len(d.get('features',[])), d.get('metadata'))" || true
          echo "== ohsome DE bbox"
          curl -4 -sS -m 600 -A "$UA" -o /tmp/d.json -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" --data-urlencode "bboxes=5.8,47.2,15.1,55.1" --data-urlencode "filter=$F" --data-urlencode "properties=tags" https://api.ohsome.org/v1/elements/centroid || true
          python3 -c "import json;d=json.load(open('/tmp/d.json'));print('features',len(d.get('features',[])))" || head -c 400 /tmp/d.json
