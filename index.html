<style>
/* Layout: full-screen map, signage-style top bar, floating "nearest" action, bottom sheet for details. */
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --fg: #1A2233;
  --muted: #5B6477;
  --line: #D9DDE6;
  --cd-orange: #EE7203;   /* international civil defence sign: orange square */
  --cd-blue: #1D4E9E;     /* ... with a blue triangle */
  --on-blue: #FFFFFF;
  --metro: #0E7C6B;
  --bunker: #7A5C3E;
  --warn-bg: #FFF1DE;
  --warn-fg: #7A3E00;
  --tile-filter: none;
  --shadow: 0 6px 24px rgba(20, 30, 60, .18);
  --f-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151D; --surface: #1A2030; --fg: #E8ECF4; --muted: #A2ABBE; --line: #2D3548;
    --cd-blue: #6E9BE8; --on-blue: #0B1830; --metro: #3CC2AA; --bunker: #C9A27C;
    --warn-bg: #3A2A12; --warn-fg: #FFD39A;
    --tile-filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9);
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151D; --surface: #1A2030; --fg: #E8ECF4; --muted: #A2ABBE; --line: #2D3548;
  --cd-blue: #6E9BE8; --on-blue: #0B1830; --metro: #3CC2AA; --bunker: #C9A27C;
  --warn-bg: #3A2A12; --warn-fg: #FFD39A;
  --tile-filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9);
  --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--f-body);
  display: flex; flex-direction: column;
}
header {
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
  z-index: 1000;
}
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 {
  font: 700 22px/1 var(--f-display); letter-spacing: .01em; margin: 0;
  text-wrap: balance;
}
.brand small { display: block; font: 600 11px/1.2 var(--f-body); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.layers { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  border-radius: 999px; padding: 5px 11px; font: 600 13px/1 var(--f-body); cursor: pointer;
}
.chip[aria-pressed="false"] { opacity: .45; }
.chip:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--cd-orange); outline-offset: 2px; }
.dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.dot.shelter { background: var(--cd-blue); }
.dot.metro { background: var(--metro); }
.dot.bunker { background: transparent; border: 2px dashed var(--bunker); }
.lang { display: flex; gap: 2px; }
.lang button {
  border: 0; background: transparent; color: var(--muted); font: 600 12px/1 var(--f-body);
  padding: 6px 6px; cursor: pointer; border-radius: 6px; letter-spacing: .05em;
}
.lang button[aria-pressed="true"] { color: var(--fg); background: var(--bg); }
main { position: relative; flex: 1; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--bg); }
.leaflet-tile-pane { filter: var(--tile-filter); }
.leaflet-container { font-family: var(--f-body); }
.leaflet-control-attribution { background: var(--surface) !important; color: var(--muted) !important; }
.leaflet-control-attribution a { color: var(--cd-blue) !important; }
.leaflet-bar a { background: var(--surface) !important; color: var(--fg) !important; border-color: var(--line) !important; }
.status {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  z-index: 600; max-width: calc(100% - 120px);
  background: var(--surface); color: var(--fg); box-shadow: var(--shadow);
  border-radius: 999px; padding: 7px 14px; font: 600 13px/1.3 var(--f-body); text-align: center;
}
.status.err { background: var(--warn-bg); color: var(--warn-fg); }
.fab {
  position: absolute; z-index: 600;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
}
.btn {
  border: 0; cursor: pointer; border-radius: 12px; box-shadow: var(--shadow);
  font: 700 16px/1 var(--f-display); letter-spacing: .02em; padding: 14px 18px;
  background: var(--cd-orange); color: #1A1206;
}
.btn.secondary { background: var(--surface); color: var(--fg); font-size: 14px; padding: 11px 14px; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 800;
  background: var(--surface); color: var(--fg); box-shadow: var(--shadow);
  border-radius: 16px 16px 0 0; max-height: 62%; overflow-y: auto;
  padding-top: 14px;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-in { max-width: 640px; margin: 0 auto; display: grid; gap: 10px; }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; }
.sheet-head h2 { font: 700 21px/1.15 var(--f-display); margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; text-wrap: balance; }
.close { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 10px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; flex: none; }
.kind { font: 600 12px/1 var(--f-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.facts { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.warn { background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions a {
  display: inline-flex; align-items: center; text-decoration: none; font: 600 14px/1 var(--f-body);
  padding: 10px 13px; border-radius: 10px; border: 1px solid var(--line); color: var(--fg); background: var(--bg);
}
.actions a.primary { background: var(--cd-blue); border-color: var(--cd-blue); color: var(--on-blue); }
.near { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.near button {
  width: 100%; text-align: left; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 10px; padding: 9px 11px; cursor: pointer; font: 15px/1.3 var(--f-body);
}
.near .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.near .km { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.sos { font: 700 15px/1.3 var(--f-body); }
.sos b { color: var(--cd-orange); font-family: var(--f-display); font-size: 19px; }
@media (max-width: 560px) {
  .layers { margin-left: 0; width: 100%; }
  .brand h1 { font-size: 20px; }
  .status { top: 10px; max-width: calc(100% - 32px); }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>

function distKm(a, b, c, d) {
  var R = 6371, r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r;
  var h = Math.sin(x / 2) * Math.sin(x / 2) + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) * Math.sin(y / 2);
  return 2 * R * Math.asin(Math.sqrt(h));
}
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function nameOf(p) { var tg = p.tags; return tg["name:" + lang] || tg.name || tg["official_name"] || tg.ref || t("unnamed"); }

var map, layers = {}, items = [], visible = { shelter: true, metro: true, bunker: true };
var statusEl, sheet, sheetIn, timer = null, ctrl = null, inflight = null, inflightKey = "", lastKey = "", userPos = null, userMarker = null;

function setStatus(msg, err) {
  statusEl.textContent = msg; statusEl.className = "status" + (err ? " err" : ""); statusEl.hidden = !msg;
}
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function styleFor(kind) {
  if (kind === "shelter") return { radius: 8, color: "#ffffff", weight: 2, fillColor: css("--cd-blue"), fillOpacity: 1 };
  if (kind === "metro") return { radius: 7, color: "#ffffff", weight: 2, fillColor: css("--metro"), fillOpacity: 1 };
  return { radius: 6, color: css("--bunker"), weight: 2, dashArray: "3 3", fillColor: css("--bunker"), fillOpacity: .15 };
}
function render() {
  ["shelter", "metro", "bunker"].forEach(function (k) { layers[k].clearLayers(); });
  items.forEach(function (p) {
    var m = L.circleMarker([p.lat, p.lon], styleFor(p.kind));
    m.on("click", function () { showPlace(p); });
    layers[p.kind].addLayer(m);
  });
  var n = items.filter(function (p) { return visible[p.kind]; }).length;
  setStatus(n ? t("shown") + n : t("none"));
}

function save(key, list) {
  try { localStorage.setItem("ub-cache", JSON.stringify({ key: key, items: list.slice(0, 4000) })); } catch (e) { /* storage unavailable */ }
}
function loadCache() {
  try { var c = JSON.parse(localStorage.getItem("ub-cache") || "null"); return c && c.items ? c.items : null; } catch (e) { return null; }
}

function fetchOverpass(q, i, c) {
  var own = new AbortController();
  var tm = setTimeout(function () { own.abort(); }, 40000);   // one slow server: try the next one
  var onAbort = function () { own.abort(); };
  c.signal.addEventListener("abort", onAbort);
  return fetch(ENDPOINTS[i], { method: "POST", body: "data=" + encodeURIComponent(q),
    headers: { "Content-Type": "application/x-www-form-urlencoded" }, signal: own.signal })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .catch(function (e) {
      if (c.signal.aborted || i + 1 >= ENDPOINTS.length) throw e;
      return fetchOverpass(q, i + 1, c);
    })
    .finally(function () { clearTimeout(tm); c.signal.removeEventListener("abort", onAbort); });
}
function load(force) {
  if (!map) return Promise.resolve();
  if (map.getZoom() < MIN_ZOOM) { setStatus(t("zoomIn")); return Promise.resolve(); }
  var b = map.getBounds().pad(0.25);
  var key = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map(function (v) { return v.toFixed(2); }).join(",");
  if (inflight && key === inflightKey) return inflight;   // same area already loading: wait for it
  if (!force && key === lastKey) return Promise.resolve();
  if (ctrl) ctrl.abort();
  ctrl = new AbortController();
  var myCtrl = ctrl, slow = setTimeout(function () { setStatus(t("slow")); }, 6000);
  setStatus(t("loading"));
  inflightKey = key;
  inflight = fetchOverpass(buildQuery(b), 0, myCtrl).then(function (json) {
    lastKey = key; items = parse(json); save(key, items); render();
  }).catch(function (e) {
    if (myCtrl.signal.aborted) return;
    var c = loadCache();
    if (c && c.length) { items = c; render(); setStatus(t("cached"), true); }
    else setStatus(t("loadErr"), true);
  }).then(function () {
    clearTimeout(slow);
    if (ctrl === myCtrl) { inflight = null; inflightKey = ""; }
  });
  return inflight;
}
function scheduleLoad() { clearTimeout(timer); timer = setTimeout(load, 450); }

function link(href, label, primary) {
  return '<a href="' + esc(href) + '" target="_blank" rel="noopener"' + (primary ? ' class="primary"' : "") + ">" + esc(label) + "</a>";
}
function openSheet(html) { sheetIn.innerHTML = html; sheet.hidden = false; var c = sheetIn.querySelector(".close"); if (c) c.focus(); }
function closeSheet() { sheet.hidden = true; }

function showPlace(p) {
  var tg = p.tags, rows = [];
  var kindLabel = p.kind === "shelter" ? t("kShelter") : p.kind === "metro" ? t("kMetro") : t("kBunker");
  if (tg.bunker_type) rows.push([t("fType"), (BUNKER_TYPES[lang][tg.bunker_type] || tg.bunker_type)]);
  if (tg.start_date || tg["construction_date"]) rows.push([t("fYear"), tg.start_date || tg.construction_date]);
  if (tg.operator) rows.push([t("fOp"), tg.operator]);
  if (tg.access) rows.push([t("fAccess"), tg.access]);
  if (tg.level || tg.layer) rows.push([t("fLevel"), tg.level || tg.layer]);
  var warn = p.kind === "bunker" ? t("wBunker") : p.kind === "metro" ? t("wMetro") : t("wShelter");
  if (isAbandoned(tg)) warn = t("wAbandoned") + " " + warn;
  var dist = userPos ? " · " + distKm(userPos[0], userPos[1], p.lat, p.lon).toFixed(1) + " km" : "";
  var html = '<div class="sheet-head"><div style="flex:1;min-width:0;display:grid;gap:6px">' +
    '<div class="kind"><span class="dot ' + p.kind + '"></span>' + esc(kindLabel) + esc(dist) + "</div>" +
    "<h2>" + esc(nameOf(p)) + "</h2></div>" +
    '<button class="close" aria-label="×" data-close>×</button></div>' +
    (rows.length ? '<dl class="facts">' + rows.map(function (r) { return "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>"; }).join("") + "</dl>" : "") +
    (tg.description ? '<p class="note">' + esc(tg.description) + "</p>" : "") +
    '<div class="warn">' + esc(warn) + "</div>" +
    '<div class="actions">' +
    (p.kind !== "bunker" ? link("https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=" + p.lat + "," + p.lon, t("route"), true) : "") +
    link("https://www.openstreetmap.org/" + p.id, t("osm")) +
    link("https://www.openstreetmap.org/edit#map=19/" + p.lat.toFixed(5) + "/" + p.lon.toFixed(5), t("fix")) +
    "</div>";
  openSheet(html);
}

function showNearest(cand) {
  var html = '<div class="sheet-head"><h2>' + esc(t("nearTitle")) + '</h2><button class="close" aria-label="×" data-close>×</button></div>';
  if (!cand.length) html += '<p class="note">' + esc(t("nearNone")) + "</p>";
  else html += '<ul class="near">' + cand.map(function (c, i) {
    return '<li><button data-near="' + i + '"><span class="dot ' + c.p.kind + '"></span><span class="nm">' + esc(nameOf(c.p)) +
      '</span><span class="km">' + c.d.toFixed(1) + " km</span></button></li>";
  }).join("") + "</ul>";
  html += '<p class="sos">' + esc(t("sos")) + "<b>112</b></p>";
  openSheet(html);
  sheetIn.querySelectorAll("[data-near]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var p = cand[+btn.getAttribute("data-near")].p;
      map.setView([p.lat, p.lon], Math.max(map.getZoom(), 16));
      showPlace(p);
    });
  });
}
var NEAR_RADII = [3000, 15000, 50000];
function searchNear(step) {
  var r = NEAR_RADII[step];
  setStatus(t("searching") + " " + (r / 1000) + " km…");
  var c = new AbortController();
  return fetchOverpass(nearQuery(userPos[0], userPos[1], r), 0, c).then(function (json) {
    var found = parse(json).filter(function (p) { return p.kind !== "bunker"; });
    if (!found.length && step + 1 < NEAR_RADII.length) return searchNear(step + 1);
    return found;
  });
}
function mergeItems(list) {
  var have = {};
  items.forEach(function (p) { have[p.id] = 1; });
  list.forEach(function (p) { if (!have[p.id]) { items.push(p); have[p.id] = 1; } });
  render();
}
function locate() {
  if (!navigator.geolocation) { setStatus(t("geoErr"), true); return; }
  setStatus(t("locating"));
  navigator.geolocation.getCurrentPosition(function (pos) {
    userPos = [pos.coords.latitude, pos.coords.longitude];
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker(userPos, { radius: 9, color: "#ffffff", weight: 3, fillColor: css("--cd-orange"), fillOpacity: 1 }).addTo(map);
    searchNear(0).then(function (found) {
      mergeItems(found);
      var near = found.map(function (p) { return { p: p, d: distKm(userPos[0], userPos[1], p.lat, p.lon) }; })
        .sort(function (a, b) { return a.d - b.d; }).slice(0, 6);
      if (near.length) {
        var bb = L.latLngBounds([userPos]);
        near.slice(0, 3).forEach(function (n) { bb.extend([n.p.lat, n.p.lon]); });
        map.fitBounds(bb.pad(0.2), { maxZoom: 16, animate: false });
      } else {
        map.setView(userPos, 13, { animate: false });
      }
      showNearest(near);
    }).catch(function () { setStatus(t("loadErr"), true); });
  }, function () { setStatus(t("geoErr"), true); }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}
function showAbout() {
  openSheet('<div class="sheet-head"><h2>' + esc(t("aboutTitle")) + '</h2><button class="close" aria-label="×" data-close>×</button></div>' +
    ["about1", "about2", "about3", "about4"].map(function (k) { return '<p class="note" style="font-size:15px;color:var(--fg);margin:0">' + esc(t(k)) + "</p>"; }).join("") +
    '<p class="sos">' + esc(t("sos")) + "<b>112</b></p>" +
    '<div class="actions">' + link("https://www.openstreetmap.org/edit#map=" + map.getZoom() + "/" + map.getCenter().lat.toFixed(5) + "/" + map.getCenter().lng.toFixed(5), t("fix"), true) + "</div>");
}

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.getElementById("t-title").textContent = t("title");
  document.getElementById("t-sub").textContent = t("sub");
  document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t(el.getAttribute("data-t")); });
  document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang)); });
  if (map) { if (items.length) render(); else if (map.getZoom() < MIN_ZOOM) setStatus(t("zoomIn")); }
  closeSheet();
}

function start() {
  statusEl = document.getElementById("status");
  sheet = document.getElementById("sheet");
  sheetIn = document.getElementById("sheet-in");
  if (typeof L === "undefined") { applyLang(); setStatus(t("loadErr"), true); return; }
  map = L.map("map", { preferCanvas: true, zoomControl: true, worldCopyJump: true }).setView([50.1, 14.4], 5);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  }).addTo(map);
  ["shelter", "metro", "bunker"].forEach(function (k) { layers[k] = L.layerGroup().addTo(map); });
  map.on("moveend", scheduleLoad);
  ["shelter", "metro", "bunker"].forEach(function (k) {
    var b = document.getElementById("l-" + k);
    b.addEventListener("click", function () {
      visible[k] = !visible[k]; b.setAttribute("aria-pressed", String(visible[k]));
      if (visible[k]) map.addLayer(layers[k]); else map.removeLayer(layers[k]);
      if (items.length) setStatus(t("shown") + items.filter(function (p) { return visible[p.kind]; }).length);
    });
  });
  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () { lang = b.getAttribute("data-lang"); try { localStorage.setItem("ub-lang", lang); } catch (e) { /* ignore */ } applyLang(); });
  });
  document.getElementById("b-near").addEventListener("click", locate);
  document.getElementById("b-info").addEventListener("click", showAbout);
  sheet.addEventListener("click", function (e) { if (e.target.closest("[data-close]")) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
  applyLang();
  setStatus(t("zoomIn"));
}
document.addEventListener("DOMContentLoaded", start);
</script>
</body>
</html>
